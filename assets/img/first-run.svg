<rect x="12" y="12" width="296" height="636" rx="34" fill="#1b2420"/>
<text x="38" y="38" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e9efe9" font-weight="500" text-anchor="start" opacity="1.0">12:30</text>

<text x="34" y="88" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#e9efe9" font-weight="600" text-anchor="start" opacity="1.0">Choose your home app</text><text x="34" y="110" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a9b6ad" font-weight="400" text-anchor="start" opacity="1.0">Set Decoy as the default to use it</text><text x="34" y="126" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a9b6ad" font-weight="400" text-anchor="start" opacity="1.0">every time you press Home.</text><rect x="30" y="156" width="260" height="48" rx="16" fill="#ffffff" opacity="0.12"/><circle cx="52" cy="180" r="9" fill="#9fd5b7" stroke="#9fd5b7" stroke-width="2" opacity="1.0"/><text x="72" y="185" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e9efe9" font-weight="400" text-anchor="start" opacity="1.0">Decoy Launcher</text><rect x="30" y="214" width="260" height="48" rx="16" fill="#ffffff" opacity="0.07"/><circle cx="52" cy="238" r="9" fill="none" stroke="#a9b6ad" stroke-width="2" opacity="1.0"/><text x="72" y="243" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e9efe9" font-weight="400" text-anchor="start" opacity="1.0">System launcher</text><rect x="188" y="290" width="100" height="34" rx="17" fill="#9fd5b7" opacity="1.0"/><text x="238.0" y="312" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#13201a" font-weight="600" text-anchor="middle" opacity="1.0">Set default</text>

<text x="34" y="76" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#e9efe9" font-weight="700" text-anchor="start" opacity="1.0">Backup &amp; restore</text><text x="30" y="124" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e9efe9" font-weight="500" text-anchor="start" opacity="1.0">Include home screen layout</text><text x="30" y="141" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#a9b6ad" font-weight="400" text-anchor="start" opacity="1.0">Pages, folders and widgets</text><rect x="250" y="112" width="36" height="20" rx="10" fill="#9fd5b7" opacity="1.0"/><circle cx="276" cy="122" r="7" fill="#13201a" opacity="1.0"/><rect x="34" y="160" width="252" height="34" rx="17" fill="#9fd5b7" opacity="1.0"/><text x="160.0" y="182" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#13201a" font-weight="600" text-anchor="middle" opacity="1.0">Save a backup file</text><text x="160.0" y="228" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9fd5b7" font-weight="600" text-anchor="middle" opacity="1.0">Restore from a file</text><rect x="34" y="260" width="252" height="110" rx="18" fill="#ffffff" opacity="0.05"/><text x="52" y="288" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#a08bff" font-weight="600" text-anchor="start" opacity="1.0">Never in a backup</text><text x="52" y="312" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a9b6ad" font-weight="400" text-anchor="start" opacity="1.0">• PINs, codes and vaults</text><text x="52" y="330" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a9b6ad" font-weight="400" text-anchor="start" opacity="1.0">• Draw-to-reveal shape</text><text x="52" y="348" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a9b6ad" font-weight="400" text-anchor="start" opacity="1.0">• Intruder photos and search history</text>

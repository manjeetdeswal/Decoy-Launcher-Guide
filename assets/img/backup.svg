<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" role="img" aria-label="Backup and restore" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<rect x="12" y="12" width="616" height="347" fill="#121a16"/>

<rect x="12.0" y="12.0" width="616.0" height="347.0" rx="0" fill="#161e1a" opacity="1.0"/><rect x="260.0" y="42.0" width="18.0" height="4.0" rx="2" fill="#9fd5b7" opacity="1.0"/><rect x="286.0" y="42.0" width="18.0" height="4.0" rx="2" fill="#3a4741" opacity="1.0"/><rect x="312.0" y="42.0" width="18.0" height="4.0" rx="2" fill="#3a4741" opacity="1.0"/><rect x="338.0" y="42.0" width="18.0" height="4.0" rx="2" fill="#3a4741" opacity="1.0"/><rect x="364.0" y="42.0" width="18.0" height="4.0" rx="2" fill="#3a4741" opacity="1.0"/><text x="320.0" y="84.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#eef3ef" font-weight="700" text-anchor="middle" opacity="1.0">Welcome to Decoy</text><text x="320.0" y="104.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#a7b4ac" font-weight="400" text-anchor="middle" opacity="1.0">Start fresh, or bring your settings with you</text><rect x="170.0" y="128.0" width="300.0" height="42.0" rx="12" fill="#ffffff" opacity="0.06"/><text x="188.0" y="146.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#eef3ef" font-weight="600" text-anchor="start" opacity="1.0">Start fresh</text><text x="188.0" y="161.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#a7b4ac" font-weight="400" text-anchor="start" opacity="1.0">Pick a few things in the next steps</text><rect x="170.0" y="178.0" width="300.0" height="42.0" rx="12" fill="#eef3ef" opacity="1"/><text x="188.0" y="196.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#13201a" font-weight="600" text-anchor="start" opacity="1.0">Copy from another TV</text><text x="188.0" y="211.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#3c4a43" font-weight="400" text-anchor="start" opacity="1.0">On the same Wi-Fi, with a 6-digit code</text><rect x="170.0" y="228.0" width="300.0" height="42.0" rx="12" fill="#ffffff" opacity="0.06"/><text x="188.0" y="246.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#eef3ef" font-weight="600" text-anchor="start" opacity="1.0">From a phone or computer</text><text x="188.0" y="261.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#a7b4ac" font-weight="400" text-anchor="start" opacity="1.0">Over Wi-Fi, in a browser</text><rect x="170.0" y="278.0" width="300.0" height="42.0" rx="12" fill="#ffffff" opacity="0.06"/><text x="188.0" y="296.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#eef3ef" font-weight="600" text-anchor="start" opacity="1.0">From a backup file</text><text x="188.0" y="311.0" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#a7b4ac" font-weight="400" text-anchor="start" opacity="1.0">With the TV&#x27;s file picker</text>
</g>

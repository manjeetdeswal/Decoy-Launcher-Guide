    <stop offset="0" stop-color="#24372f"/><stop offset="1" stop-color="#0f1714"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#e2574c" stop-opacity="0.28"/><stop offset="1" stop-color="#e2574c" stop-opacity="0"/></radialGradient>
